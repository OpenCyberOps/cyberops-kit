name: Self-scan

# We dogfood everything: CyberOps Kit scans itself on every push and publishes the
# result, including when the result is unflattering (see SECURITY.md).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
      pull-requests: write     # post the score comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # Gitleaks needs full history

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # CyberOps Kit and every scanner come from this repository's own flake. Each
      # tool is pinned in flake.lock and hash-verified by Nix, so there is no
      # `curl | sh` and no `@latest`. The tool versions in the published report
      # change only when a reviewed flake.lock update changes them. This is the
      # package our users install, so it is the one we scan with.
      - name: Install CyberOps Kit and scanners
        run: |
          nix build .#default --out-link "$RUNNER_TEMP/cyberops-kit"
          echo "$RUNNER_TEMP/cyberops-kit/bin" >> "$GITHUB_PATH"

      - name: Report scanner availability
        run: cyberops doctor

      # The trend dashboard needs past runs, and each CI run starts empty. On main,
      # seed the history index from the published site so this run adds to it.
      # It is trend data only: nothing in it reaches the score (INV-1).
      - name: Restore published history
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p .cyberops/history
          curl -sSfL --max-time 30 -o .cyberops/history/index.json \
            "https://opencyberops.github.io/cyberops-kit/report/history/index.json" \
            || { echo "No published history yet; starting a new series."; rm -f .cyberops/history/index.json; }

      - name: Scan
        id: scan
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fail the build on our own score here. The point is to publish the
        # result honestly, not to hide a bad one by gating the pipeline on it.
        continue-on-error: true
        run: cyberops scan . --output .cyberops --pr-comment

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: .cyberops/report.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: .cyberops/
          # upload-artifact skips dot-directories by default, and it did: every
          # earlier run uploaded nothing.
          include-hidden-files: true

      - name: Publish the summary
        run: cat .cyberops/report.md >> "$GITHUB_STEP_SUMMARY"

  # Publishes our own report card, including when it is unflattering: the docs site
  # at /, the latest report at /report/, the trend at /report/trend.html, and the
  # shields.io endpoint at /report/badge.json that the README badge reads.
  publish:
    name: Publish report card and docs
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}report/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build the docs
        run: |
          python -m pip install ".[docs]"
          python -m mkdocs build --strict --site-dir _site

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: _site/report/

      - name: Assemble the report card
        run: |
          set -euo pipefail
          cd _site/report
          test -s report.html && test -s badge.json
          cp report.html index.html
          cp ../../dashboard/index.html trend.html
          rm -f pr-comment.md

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
