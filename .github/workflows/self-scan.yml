name: Self-scan

# We dogfood everything: CyberOps Kit scans itself on every push and publishes the
# result, including when the result is unflattering (see SECURITY.md).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
      pull-requests: write     # post the score comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # Gitleaks needs full history

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # CyberOps Kit and every scanner come from this repository's own flake. Each
      # tool is pinned in flake.lock and hash-verified by Nix, so there is no
      # `curl | sh` and no `@latest`. The tool versions in the published report
      # change only when a reviewed flake.lock update changes them. This is the
      # package our users install, so it is the one we scan with.
      - name: Install CyberOps Kit and scanners
        run: |
          nix build .#default --out-link "$RUNNER_TEMP/cyberops-kit"
          echo "$RUNNER_TEMP/cyberops-kit/bin" >> "$GITHUB_PATH"

      - name: Report scanner availability
        run: cyberops doctor

      - name: Scan
        id: scan
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fail the build on our own score here. The point is to publish the
        # result honestly, not to hide a bad one by gating the pipeline on it.
        continue-on-error: true
        run: cyberops scan . --output .cyberops --pr-comment

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: .cyberops/report.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: .cyberops/
          # upload-artifact skips dot-directories by default, and it did: every
          # earlier run uploaded nothing.
          include-hidden-files: true

      - name: Publish the summary
        run: cat .cyberops/report.md >> "$GITHUB_STEP_SUMMARY"
